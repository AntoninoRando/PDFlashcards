[project]
name = "pdflashcards-service"
version = "0.1.0"
description = "PDFlashcards backend: study-set parser, autosave and camera gesture recognition"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-socketio>=5.13.0",
    "mediapipe>=0.10.21",
    "opencv-python-headless>=4.11.0.86",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
