services:
  # Web app (Vite dev server). The Python service runs on the host (see
  # start.sh) because it needs access to the camera.
  vue-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "5173:5173"
    volumes:
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      - ./vite.config.js:/app/vite.config.js
      # Prevent node_modules from being overwritten
      - /app/node_modules
    environment:
      - NODE_ENV=development
      # Where the dev server proxies `/api` and `/socket.io`
      - API_PROXY_TARGET=http://host.docker.internal:5001
    extra_hosts:
      - "host.docker.internal:host-gateway"
